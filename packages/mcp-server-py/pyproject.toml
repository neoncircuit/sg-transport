[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-transport-mcp"
version = "0.0.1"
description = "MCP query layer over the SG Live gateway vehicle store"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
sg-transport-mcp = "sg_transport_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
