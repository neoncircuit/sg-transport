server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: MapLibre client routes are client-side only.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|geojson|png|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
