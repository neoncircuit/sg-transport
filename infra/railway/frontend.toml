# Railway service: frontend-ts (static nginx)
# Dashboard: Root Directory = /  ·  Config path = /infra/railway/frontend.toml
# Build arg / env at build time: VITE_WS_URL=wss://<backend-public-host>/ws

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/Dockerfile.frontend"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
