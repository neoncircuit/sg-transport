name: GitHub Pages demo

# Deploys from `main` only (no extra branches).
# One-time: Settings → Pages → Source = GitHub Actions, then re-run this workflow.
# https://github.com/neoncircuit/sg-transport/settings/pages

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend-ts/**"
      - "packages/shared-types-ts/**"
      - "scripts/app-version.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build demo frontend
        run: pnpm --filter @sg-transport/frontend... build
        env:
          VITE_DEMO_MODE: "1"
          VITE_BASE: /sg-transport/
          APP_VERSION: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}

      - name: Add 404.html for GitHub Pages SPA fallback
        run: cp apps/frontend-ts/dist/index.html apps/frontend-ts/dist/404.html

      # Fails with a clear message if Pages is not enabled yet (common first-run).
      - name: Require Pages (GitHub Actions source)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
            } catch (err) {
              core.setFailed(
                "GitHub Pages is not enabled for this repo yet.\\n" +
                  "Fix once: Settings → Pages → Source = GitHub Actions\\n" +
                  `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages\\n` +
                  "Then re-run this workflow (Actions → GitHub Pages demo → Run workflow)."
              );
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/frontend-ts/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
