name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monorepo:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + tags for `git describe` versioning.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve app version
        run: |
          echo "APP_VERSION=$(node scripts/app-version.mjs)" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
          GIT_SHA: ${{ env.GIT_SHA }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: monorepo
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name prefix
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "prefix=ghcr.io/${owner}/sg-transport" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$(node scripts/app-version.mjs)" >> "$GITHUB_ENV"
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build backend-ts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_SHA=${{ env.GIT_SHA }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:latest
            ${{ steps.meta.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build bus-poller stub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.bus-poller
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-bus-poller:latest
            ${{ steps.meta.outputs.prefix }}-bus-poller:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
