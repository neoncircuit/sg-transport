name: Geometry extract

on:
  schedule:
    # Weekly Monday 03:17 UTC — routes change rarely
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-rail:
    name: Refresh OSM rail GeoJSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Extract rail
        run: pnpm --filter @sg-transport/geometry extract:rail

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/geometry-ts/data/rail.geojson apps/frontend-ts/public/geometry/rail.geojson
          if git diff --staged --quiet; then
            echo "No geometry changes"
          else
            git commit -m "chore: refresh OSM rail geometry"
            git push
          fi
