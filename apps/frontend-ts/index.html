<!doctype html>
<html lang="en" data-theme="harbour">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050b12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SG Live — Singapore Transport Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="map" role="application" aria-label="Singapore live transport map"></div>

    <section
      class="sheet"
      id="sheet"
      aria-label="SG Live controls"
      data-expanded="false"
    >
      <button type="button" class="sheet-handle" id="sheet-toggle" aria-expanded="false">
        <span class="sheet-handle-bar" aria-hidden="true"></span>
        <span class="sheet-handle-label">Details</span>
      </button>

      <div class="sheet-peek">
        <div class="sheet-brand-row">
          <h1 class="brand">SG Live</h1>
          <span class="phase-badge" title="Simulated vehicles; geometry Phase 1">Phase 1</span>
        </div>
        <div class="status-row">
          <span class="live-dot" id="live-dot" aria-hidden="true"></span>
          <p class="status" id="status">Connecting…</p>
        </div>
      </div>

      <div class="sheet-body" id="sheet-body" hidden>
        <p class="tagline">Singapore, moving — built for the commute</p>

        <ul class="legend" id="legend" aria-label="Vehicle modes">
          <li data-mode="bus"><span class="swatch"></span>Bus <b id="count-bus">0</b></li>
          <li data-mode="mrt"><span class="swatch"></span>MRT <b id="count-mrt">0</b></li>
          <li data-mode="lrt"><span class="swatch"></span>LRT <b id="count-lrt">0</b></li>
          <li data-mode="plane"><span class="swatch"></span>Air <b id="count-plane">0</b></li>
          <li data-mode="ship"><span class="swatch"></span>Sea <b id="count-ship">0</b></li>
        </ul>

        <div class="theme-picker">
          <span class="theme-picker-label" id="theme-label">Theme</span>
          <ul
            class="theme-swatches"
            id="theme-swatches"
            role="radiogroup"
            aria-labelledby="theme-label"
          ></ul>
        </div>

        <footer class="credits">
          Inspired by
          <a href="https://london.jamespotter.dev/" target="_blank" rel="noreferrer"
            >James Potter’s Zone One</a
          >
          and
          <a href="https://london.pengrubin.com" target="_blank" rel="noreferrer"
            >Hongwei PENG’s London Live</a
          >
          — adapted for Singapore. Basemap
          <a href="https://openfreemap.org" target="_blank" rel="noreferrer">OpenFreeMap</a>
          / OSM. Vehicles on screen are <em>simulated</em>.
        </footer>
      </div>
    </section>

    <button
      type="button"
      class="locate-btn"
      id="locate-btn"
      aria-label="Center map on my location"
      title="Center on me"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          fill="currentColor"
          d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06ZM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14Z"
        />
      </svg>
    </button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
